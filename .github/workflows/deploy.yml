name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Both dockerfiles must stay identical
        run: diff Dockerfile Dockerfile.dokploy

      # macOS writes "name 2.ts" beside "name.ts" when a folder is copied or
      # synced, and a `git add -A` takes them along without a word. Six of them
      # reached main that way. Cheaper to fail here than to find them later.
      - name: No duplicated files
        run: |
          FOUND=$(git ls-files | grep -E ' [0-9]+\.[A-Za-z]+$' || true)
          if [ -n "$FOUND" ]; then
            echo "These look like Finder copies and should not be versioned:"
            echo "$FOUND"
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # The other half talks to a real database, which this job has no route to
      # and is given no credential for; those tests stay where one exists.
      - name: The tests that need no database must pass
        run: pnpm test:unit

      - name: The env example must match the schema
        run: pnpm check:env

      - name: Cover colours must meet WCAG AA
        run: pnpm check:contrast

  build-and-push:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify image exists on GHCR
        env:
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
        run: |
          # GitHub hands the repository back in its canonical case, and a Docker
          # reference carries no uppercase letter in its path; the push survives
          # that only because docker/metadata-action lowercases the name for the
          # tags it writes. The digest names the image that was just pushed
          # rather than whatever happens to be wearing the tag.
          if [ -z "$DIGEST" ]; then
            echo "The build produced no digest, so nothing was pushed"
            exit 1
          fi
          IMAGE="${REGISTRY}/$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')@${DIGEST}"
          echo "Verifying $IMAGE"
          docker buildx imagetools inspect "$IMAGE"

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deployment webhook
        env:
          WEBHOOK: ${{ secrets.DEPLOYMENT_WEBHOOK_URL }}
        run: |
          # An unset secret reaches the step as an empty string, and curl then
          # exits 3 for a malformed URL — a number that says nothing about what
          # is missing. Named here so the log does.
          if [ -z "$WEBHOOK" ]; then
            echo "DEPLOYMENT_WEBHOOK_URL is not set on this repository."
            echo "The image is built, pushed and verified; only the deployment"
            echo "was not triggered. Add the secret under Settings > Secrets and"
            echo "variables > Actions, then re-run this job."
            exit 1
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 -X POST "$WEBHOOK")
          echo "Webhook responded with $STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Deployment webhook failed"
            exit 1
          fi
